<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Untuk Kamu ❤️</title>

    <link href="css/main.min.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <div id="mobile" :class="{ 'has-prompt': hasPrompt }">

        <!-- HEADER -->
        <div id="mobile-head">
            <div id="mobile-head-title">
                Untuk Kamu ❤️
            </div>
        </div>

        <!-- CHAT BODY -->
        <div id="mobile-body">
            <div id="mobile-body-bg"></div>

            <div id="mobile-body-content">

                <!-- Temporary message container -->
                <div id="mock-msg-row" class="msg-row">
                    <div
                        id="mock-msg"
                        class="msg"
                        v-html="latestMsgContent">
                    </div>
                </div>

                <!-- Chat messages -->
                <div
                    class="msg-row"
                    v-for="(msg, index) in messages"
                    :key="index"
                    :class="msg.author === 'author' ? 'msg-author' : 'msg-me'">

                    <div
                        class="msg"
                        :class="'msg-bounce-in-' + (msg.author === 'author' ? 'left' : 'right')"
                        :style="msg.width && msg.height ? {
                            width: msg.width - 26 + 'px',
                            height: msg.height - 18 + 'px'
                        } : {}"
                        v-html="msg.content">
                    </div>

                </div>

            </div>
        </div>

        <!-- FOOTER / RESPONSE -->
        <div id="mobile-foot">

            <!-- Response popup -->
            <div id="prompt">

                <div id="prompt-head">

                    <div class="say-something">
                        Aku mau bilang sesuatu...
                    </div>

                    <a
                        href="javascript:;"
                        class="close-btn"
                        v-on:click="togglePrompt(false)">
                    </a>

                </div>

                <div id="prompt-body">

                    <!-- Response choices -->
                    <ul
                        class="responses"
                        v-if="lastDialog && lastDialog.responses">

                        <li
                            v-for="res in lastDialog.responses"
                            :key="res.content">

                            <a
                                href="javascript:;"
                                v-on:click="respond(res)">
                                {{ res.content }}
                            </a>

                        </li>

                    </ul>

                    <!-- Next topic choices -->
                    <div
                        class="next-topic"
                        v-if="!lastDialog || !lastDialog.responses">

                        <ul class="topics">

                            <li
                                v-for="topic in nextTopics"
                                :key="topic.brief">

                                <a
                                    href="javascript:;"
                                    v-on:click="ask(topic)">
                                    {{ topic.brief }}
                                </a>

                            </li>

                        </ul>

                    </div>

                </div>
            </div>

            <!-- Input hint -->
            <div
                id="input-hint"
                class="say-something"
                v-on:click="togglePrompt(true)"
                :class="{ 'clickable': !isTyping }">

                <span v-if="!isTyping">
                    Aku mau bilang sesuatu...
                </span>

                <span v-if="isTyping">
                    Sedang mengetik...
                </span>

            </div>

        </div>

        <!-- Background for prompt -->
        <div
            id="prompt-bg"
            v-on:click="togglePrompt(false)">
        </div>

    </div>

    <!-- Source link -->
    <div class="extra-link" id="meta-link">
        <a
            class="letters"
            href="https://github.com/kurokohiko-lab/for-my-love"
            target="_blank"
            rel="noopener noreferrer">
            Sumber
        </a>
    </div>


    <!--
        IMPORTANT:
        Gunakan library lokal dari repository,
        bukan CDN eksternal.
    -->

    <script src="lib/zepto.min.js"></script>
    <script src="lib/vue.min.js"></script>

    <!-- Website logic -->
    <script src="js/index.js"></script>

</body>
</html>
